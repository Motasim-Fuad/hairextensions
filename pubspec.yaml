name: hairextensions
description: hairextensions is Price to Profit. Offline-first pricing, quoting and invoicing for hair extension professionals.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^4.0.3
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_performance: ^0.11.6
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_slidable: ^4.0.3
  flutter_svg: ^2.3.0
  fpdart: ^1.2.0
  geolocator: ^14.0.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  image_picker: ^1.2.4
  injectable: ^3.0.0
  intl: ^0.20.2
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  permission_handler: ^13.0.2
  printing: ^5.15.1
  share_plus: ^13.3.1
  sqflite: ^2.4.4+2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  workmanager: ^0.10.10
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.4
  very_good_analysis: ^10.3.0

# Regenerate after changes: dart run flutter_native_splash:create
# Colors mirror BrandPalette.primary (Vibrant Pink) and BrandPalette.darkCanvas.
flutter_native_splash:
  color: "#ED77A8"
  color_dark: "#1A1A18"
  android_12:
    color: "#ED77A8"
    color_dark: "#1A1A18"
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/images/
  fonts:
    # Main headings. Variable font (weights 400-900).
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic.ttf
          style: italic
    # Body text and smaller headings. Helvetica is a system font on Apple
    # platforms; Arimo is the bundled, metric-compatible fallback elsewhere.
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  remove_alpha_ios: true
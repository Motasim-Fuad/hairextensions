name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.1"
  # Build numbers must only grow. Raise the offset if store builds already exist.
  BUILD_NUMBER_OFFSET: "100"

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.version.outputs.build_name }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Production config has real values
        run: |
          if grep -q 'example.com' config/prod.json; then
            echo "::error::config/prod.json still contains example.com placeholders"
            exit 1
          fi
          if grep -q '"ENABLE_CERT_PINNING": true' config/prod.json && grep -q '"CERT_SHA256": ""' config/prod.json; then
            echo "::error::Certificate pinning is enabled without fingerprints"
            exit 1
          fi
          if grep -q 'YOUR_TEAM_ID' ios/ExportOptions.plist; then
            echo "::error::Set the Apple team ID in ios/ExportOptions.plist"
            exit 1
          fi

      - id: version
        name: Version from tag
        run: |
          name="${GITHUB_REF_NAME#v}"
          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            name="$(grep '^version:' pubspec.yaml | sed -E 's/version: ([0-9.]+).*/\1/')"
          fi
          echo "build_name=$name" >> "$GITHUB_OUTPUT"
          echo "build_number=$(( GITHUB_RUN_NUMBER + BUILD_NUMBER_OFFSET ))" >> "$GITHUB_OUTPUT"

  android:
    name: Android to Play internal track
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to sign a release with debug keys"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter gen-l10n

      - name: Build app bundle
        run: |
          flutter build appbundle --release --flavor prod \
            --dart-define-from-file=config/prod.json \
            --obfuscate --split-debug-info=build/symbols/android \
            --build-name=${{ needs.preflight.outputs.build_name }} \
            --build-number=${{ needs.preflight.outputs.build_number }}

      - name: Upload Dart symbols to Crashlytics
        if: env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools crashlytics:symbols:upload --app="$FIREBASE_APP_ID" build/symbols/android
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/prodRelease/app-prod-release.aab
            build/symbols/android/
          retention-days: 90

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Play internal track
        working-directory: android
        env:
          PLAY_JSON_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_JSON_KEY" > "$RUNNER_TEMP/play-key.json"
          PLAY_JSON_KEY_PATH="$RUNNER_TEMP/play-key.json" bundle exec fastlane internal

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks "$RUNNER_TEMP/play-key.json"

  ios:
    name: iOS to TestFlight
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and upload to TestFlight
        working-directory: ios
        env:
          BUILD_NAME: ${{ needs.preflight.outputs.build_name }}
          BUILD_NUMBER: ${{ needs.preflight.outputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          CRASHLYTICS_DSYM_UPLOAD: ${{ env.FIREBASE_APP_ID != '' }}
        run: bundle exec fastlane beta

      - name: Upload Dart symbols to Crashlytics
        if: env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json" \
            npx --yes firebase-tools crashlytics:symbols:upload --app="$FIREBASE_APP_ID" build/symbols/ios
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: |
            build/ios/ipa/*.ipa
            build/symbols/ios/
          retention-days: 90
